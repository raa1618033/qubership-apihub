apiVersion: v1
stringData:
  apihub_admin_email: '{{ .Values.APIHUB_ADMIN_EMAIL }}'
  apihub_admin_password: '{{ .Values.APIHUB_ADMIN_PASSWORD }}'
kind: Secret
metadata:
  name: '{{ .Values.SERVICE }}-zero-day-admin-secret'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
type: Opaque