apiVersion: v1
stringData:
  apihub_postgresql_username: {{ if (default "" .Values.qubershipApihubBackend.env.dbAdminUsername) }} '{{ .Values.qubershipApihubBackend.env.dbAdminUsername }}' {{ else }} '{{ cat qubership-apihub-backend .Values.qubershipApihub.delimiter .Values.qubershipApihub.namespace .Values.qubershipApihub.delimiter "admin" | nospace | replace "-" "_" }}' {{ end }}
  apihub_postgresql_password: {{ if (default "" .Values.qubershipApihubBackend.env.dbAdminPassword) }} '{{ .Values.qubershipApihubBackend.env.dbAdminPassword }}' {{ else }} '{{ cat qubership-apihub-backend .Values.qubershipApihub.delimiter .Values.qubershipApihub.namespace .Values.qubershipApihub.delimiter "password" | nospace | replace "-" "_" }}' {{ end }}
kind: Secret
metadata:
  name: 'qubership-apihub-backend-db-secret'
  namespace: '{{ .Values.qubershipApihub.namespace }}'
  labels:
    app.kubernetes.io/part-of: qubership-apihub
    app.kubernetes.io/managed-by: helm
type: Opaque

