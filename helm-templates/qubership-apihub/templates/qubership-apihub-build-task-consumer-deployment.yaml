---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: 'qubership-apihub-build-task-consumer'
    labels:
        name: 'qubership-apihub-build-task-consumer'
        app.kubernetes.io/name: 'qubership-apihub-build-task-consumer'
        app.kubernetes.io/version: '{{ .Values.QUBERSHIP_APIHUB_VERSION }}'
        app.kubernetes.io/component: 'job'
        app.kubernetes.io/part-of: qubership-apihub
        app.kubernetes.io/managed-by: helm
        app.kubernetes.io/technology: 'node-js'
spec:
    replicas: {{ .Values.REPLICAS }}
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
    template:
        metadata:
            labels:
                name: 'qubership-apihub-build-task-consumer'
                app.kubernetes.io/name: 'qubership-apihub-build-task-consumer'
                app.kubernetes.io/version: '{{ .Values.QUBERSHIP_APIHUB_VERSION }}'
                app.kubernetes.io/component: 'backend'
                app.kubernetes.io/part-of: qubership-apihub
                app.kubernetes.io/managed-by: helm
                app.kubernetes.io/technology: 'node-js'
        spec:
            serviceAccountName: '{{ .Values.SERVICE_ACCOUNT }}'
            containers:
            -   name: 'qubership-apihub-build-task-consumer'
                image: '{{ .Values.IMAGE_REPOSITORY }}:{{ .Values.TAG }}'
                ports:
                -   name: web
                    containerPort: 3000
                    protocol: TCP
                env:
                -   name: LOG_LEVEL
                    value: '{{ .Values.qubership-apihub.log-level }}'
                -   name: APIHUB_BACKEND_ADDRESS
                    value: '{{ .Values.APIHUB_BACKEND_ADDRESS }}'
                -   name: FOLDER_STORE
                    value: '{{ .Values.FOLDER_STORE }}'
                - name: OPERATIONS_BUILD_BATCH
                  value: '{{ .Values.OPERATIONS_BUILD_BATCH }}'
                -   name: APIHUB_API_KEY
                    valueFrom:
                        secretKeyRef:
                            name: 'qubership-apihub-build-task-consumer-api-key-secret'
                            key: access_token
                resources:
                    requests:
                        cpu: {{ .Values.qubership-apihub-build-task-consumer.resource.cpu.request }}
                        memory: '{{ .Values.qubership-apihub-build-task-consumer.resource.memory.request }}'
                    limits:
                        cpu: {{ .Values.qubership-apihub-build-task-consumer.resource.cpu.limit }}
                        memory: '{{ .Values.qubership-apihub-build-task-consumer.resource.memory.limit }}'
                livenessProbe:
                    httpGet:
                        path: /swagger
                        port: web
                    initialDelaySeconds: 15
                    timeoutSeconds: 600
                    periodSeconds: 60
                    failureThreshold: 5
                readinessProbe:
                    httpGet:
                        path: /swagger
                        port: web
                    initialDelaySeconds: 15
                    timeoutSeconds: 600
                    periodSeconds: 60
                    failureThreshold: 5
                securityContext:
                {{ if eq .Values.PAAS_PLATFORM "KUBERNETES" }}
                    runAsGroup: 10001
                {{ end }}
                    readOnlyRootFilesystem: false
                    runAsNonRoot: true
                    seccompProfile:
                        type: RuntimeDefault
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                          - ALL
    selector:
        matchLabels:
            name: 'qubership-apihub-build-task-consumer'

