---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: qubership-apihub-ui
    labels:
        name: qubership-apihub-ui
        app.kubernetes.io/name: 'qubership-apihub-ui'
        app.kubernetes.io/version: '{{ .Values.ARTIFACT_DESCRIPTOR_VERSION }}'
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: qubership-apihub
        app.kubernetes.io/managed-by: helm
        app.kubernetes.io/technology: 'cpp'
spec:
    selector:
        matchLabels:
          name: qubership-apihub-ui
    replicas: {{ .Values.REPLICAS }}
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
    template:
        metadata:
            labels:
                name: qubership-apihub-ui
                app.kubernetes.io/name: 'qubership-apihub-ui'
                app.kubernetes.io/version: '{{ .Values.ARTIFACT_DESCRIPTOR_VERSION }}'
                app.kubernetes.io/component: frontend
                app.kubernetes.io/part-of: qubership-apihub
                app.kubernetes.io/managed-by: helm
                app.kubernetes.io/technology: 'cpp'
        spec:
            restartPolicy: Always
            terminationGracePeriodSeconds: 30
            dnsPolicy: ClusterFirst
            containers:
            -   name: 'qubership-apihub-ui'
                image: '{{ .Values.IMAGE_REPOSITORY }}:{{ .Values.TAG }}'
                imagePullPolicy: Always
                ports:
                -   name: web
                    containerPort: 8080
                    protocol: TCP
                env:
{{ include "env.template" . | indent 16 }}
                resources:
                    requests:
                        cpu: '{{ .Values.qubership-apihub-ui.resource.cpu.request }}'
                        memory: '{{ .Values.qubership-apihub-ui.resource.memory.request }}'
                    limits:
                        memory: '{{ .Values.qubership-apihub-ui.resource.memory.limit }}'
                        cpu: {{ .Values.qubership-apihub-ui.resource.cpu.limit }}
                livenessProbe:
                  httpGet:
                    path: /probes/live
                    port: web
                  initialDelaySeconds: 5
                  timeoutSeconds: 15
                readinessProbe:
                  httpGet:
                    path: /probes/ready
                    port: web
                  initialDelaySeconds: 5
                securityContext:
                {{ if eq .Values.PAAS_PLATFORM "KUBERNETES" }}
                    runAsGroup: 10001
                {{ end }}
                    readOnlyRootFilesystem: false
                    runAsNonRoot: true
                    seccompProfile:
                        type: RuntimeDefault
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                          - ALL
    revisionHistoryLimit: 3
