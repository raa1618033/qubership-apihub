{{- if .Values.DNS_ROUTE_ENABLE }}
apiVersion: v1
data:
  tls.crt: '{{ .Values.TLS_CRT }}'
  tls.key: '{{ .Values.TLS_KEY }}'
kind: Secret
metadata:
  name: 'qubership-apihub-ui-tls'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/part-of: qubership-apihub
    app.kubernetes.io/managed-by: helm
type: Opaque
{{- end }}