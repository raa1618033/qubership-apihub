{{- if .Values.qubershipApihub.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: apihub
    annotations:
        nginx.ingress.kubernetes.io/proxy-connect-timeout: '3600'
        nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
        nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    labels:
        app.kubernetes.io/part-of: qubership-apihub
        app.kubernetes.io/managed-by: helm
spec:
    rules:
        -   host: '{{ .Values.qubershipApihub.ingress.host }}'
            http:
                paths:
                    -   path: '{{ .Values.qubershipApihub.ingress.path }}'
                        pathType: '{{ .Values.qubershipApihub.ingress.pathType }}'
                        backend:
                            service:
                                name: 'qubership-apihub-ui'
                                port:
                                    name: web
{{- end }}
